# Database connection (values come from the environment set by docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blogdb}
spring.datasource.username=${DB_USER:blog}
spring.datasource.password=${DB_PASSWORD:blog}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Multipart uploads (previously <multipart-config> in web.xml)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HTTP server
server.port=${PORT:8080}

# Unknown paths must reach GlobalExceptionHandler as NoHandlerFoundException (404 JSON)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Seed the database with demo data on first startup
app.seed-database=${SEED_DATABASE:true}
