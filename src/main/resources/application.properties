# Database connection (values come from the environment set by docker-compose)
db.url=${DB_URL:jdbc:postgresql://localhost:5432/blogdb}
db.username=${DB_USER:blog}
db.password=${DB_PASSWORD:blog}
db.driver=org.postgresql.Driver

# HikariCP pool
db.pool.maximum-pool-size=${DB_POOL_SIZE:10}
db.pool.minimum-idle=2
db.pool.connection-timeout=30000

# HTTP server
server.port=${PORT:8080}

# Seed the database with demo data on first startup
app.seed-database=${SEED_DATABASE:true}
